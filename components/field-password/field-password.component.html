@if (label) {
  <label class="label" [ngClass]="{'focus': onFocusClass()}">{{label}}</label>
}
<div class="input-wrap">
  <input class="input"
    [(ngModel)]="model"
    [attr.type]="show ? 'text' : 'password'"
    (change)="onChangeEvent($event)"
    (keydown)="onKeyDownEvent($event)"
    (blur)="onBlurEvent($event)"
    (focus)="onFocusEvent($event)"
    />
  <button class="icon toggle" (click)="toggleShow()" title="{{show ? 'hide' : 'show'}} password">
    <i class="fa-solid" [ngClass]="{ 'fa-eye': !show, 'fa-eye-slash': show }"></i>
  </button>
</div>
