@if (label) {
  <label class="label" [attr.for]="id()" [ngClass]="{'focus': onFocusClass()}">{{label}}</label>
}
<div class="input-wrap">
  <input class="input"
    [(ngModel)]="model"
    [attr.id]="id()"
    placeholder=" "
    [attr.type]="show ? 'text' : 'password'"
    (change)="onChangeEvent($event)"
    (keydown)="onKeyDownEvent($event)"
    (blur)="onBlurEvent($event)"
    (focus)="onFocusEvent($event)"
    />
  <button class="icon toggle" type="button" (click)="toggleShow()" [attr.aria-pressed]="show" [attr.aria-label]="show ? 'Hide password' : 'Show password'" [title]="show ? 'Hide password' : 'Show password'">
    <i class="fa-solid" [ngClass]="{ 'fa-eye': !show, 'fa-eye-slash': show }" aria-hidden="true"></i>
  </button>
</div>
