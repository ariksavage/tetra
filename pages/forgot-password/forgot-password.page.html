<div class="login-form">
  @if (sent) {
    <p class="login-notice" role="status">{{sent}}</p>
    <p>No email? Check your spam folder, or try again in a few minutes.</p>
    <p><a routerLink="/login">Back to log in</a></p>
  } @else {
    <p>Enter your username or email address, and we'll email you a link to set a new password.</p>
    <div class="field text" label="Username or email" [(model)]="login" (onEnter)="send()"></div>
    @if (formError) {
      <p class="login-error" role="alert">{{formError}}</p>
    }
    <div class="login-actions">
      <a routerLink="/login">Back to log in</a>
      <button class="login-submit" type="button" (click)="send()" [disabled]="sending">{{sending ? 'Sending…' : 'Email me a link'}}</button>
    </div>
  }
</div>
