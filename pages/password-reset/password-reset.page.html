<div class="login-form">
  @if (valid === false) {
    <p class="login-error" role="alert">This link has expired or been used.</p>
    <p><a routerLink="/forgot-password">Ask for a new one</a> · <a routerLink="/login">Log in</a></p>
  } @else if (valid) {
    <p>Choose a new password, at least 8 characters.</p>
    <div class="field password" [(model)]="password" label="New password" (onEnter)="savePassword()"></div>
    <div class="field password repeat" [(model)]="password2" label="Same password again" (onEnter)="savePassword()"></div>
    @if (formError) {
      <p class="login-error" role="alert">{{formError}}</p>
    }
    <div class="login-actions">
      <a routerLink="/login">Log in instead</a>
      <button class="login-submit" type="button" (click)="savePassword()" [disabled]="saving">{{saving ? 'Saving…' : 'Set password'}}</button>
    </div>
  } @else {
    <p role="status">Checking the link…</p>
  }
</div>
