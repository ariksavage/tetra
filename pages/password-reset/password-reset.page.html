@if (currentUser && currentUser.id) {
  <p>Hi {{currentUser.name()}}, Enter a new password below</p>
}
<div class="field password" [(model)]="password" label="Password"></div>
@if (password) {
  <div class="field password repeat" [(model)]="password2" label="Repeat Password"></div>
}
<p></p>
<button [disabled]="!canSavePassword()" (click)="savePassword()">Save Password</button>
